name: leaflens
description: "LeafLens — AI-Powered Mobile Application for Intelligent Plant Health Monitoring"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: 3.2.1
  riverpod_annotation: ^4.0.2

  # ── Navigation ────────────────────────────────────────────
  go_router: ^15.0.0
  go_router_builder: ^4.3.0

  # ── Data Classes ──────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ── ThingsBoard Integration ───────────────────────────────
  http: ^1.3.0
  web_socket_channel: ^3.0.1

  # ── Offline & Connectivity ────────────────────────────────
  connectivity_plus: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Secure Storage (JWT tokens) ───────────────────────────
  flutter_keychain: ^3.0.1

  # ── Charts ────────────────────────────────────────────────
  fl_chart: ^0.69.2

  # ── Push Notifications ────────────────────────────────────
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1

  # ── UI Utilities ──────────────────────────────────────────
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ───────────────────────────────────────
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
