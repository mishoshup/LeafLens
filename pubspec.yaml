name: leaflens
description: "LeafLens — AI-Powered Mobile Application for Intelligent Plant Health Monitoring"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^6.1.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  fl_chart: ^0.69.2
  flutter:
    sdk: flutter
  flutter_keychain: ^3.0.1
  flutter_riverpod: 3.2.1
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^15.0.0
  go_router_builder: ^4.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.3.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.2
  shimmer: ^3.0.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
