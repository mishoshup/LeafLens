name: leaflens
description: "LeafLens — AI-Powered Mobile Application for Intelligent Plant Health Monitoring"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2-dev.2
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  go_router_builder: ^4.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.3.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.2
  sentry_flutter: ^9.0.0
  shimmer: ^3.0.0
  supabase_flutter: ^2.12.4
  toastification: ^3.2.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  build_runner: ^2.15.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Variable.ttf
